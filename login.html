<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hotel Monopolio - Login</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
           
            background-color: #f0f4f8; 
            margin: 0;
        }

        .titulo_principal {
         
            color: #0f172a;
            background-color: white;
            border: 3px solid #00d2ff;
            border-radius: 50px;
            width: 300px;
            margin: 30px auto;
            padding: 10px;
            text-align: center;
        }

        .meio {
            width: 450px;
            margin: 50px auto;
            padding: 25px;
            background-color: white;
           
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 210, 255, 0.15);
        }

        .titulo_secundario {
            color: #1e293b;
            margin-bottom: 30px;
        }

        .form {
            text-align: left;
        }

        .label {
            color: #475569;
            font-weight: bold;
        }

        .input {
            width: 95%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            box-sizing: border-box;
        }

        .input:focus {
          
            border: 2px solid #00d2ff;
            outline: none;
        }

        .btn-enviar {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 25px;
           
            background-color: #0f172a;
            color: #00d2ff; 
            font-weight: bold;
            cursor: pointer;
        }

        .btn-enviar:hover {
      
            background-color: #00d2ff;
            color: #0f172a;
        }

        .cadastro {
            text-align: center;
            margin-top: 20px;
        }

        .btn-cadastro {
            padding: 10px 20px;
            border: 2px solid #0f172a;
            border-radius: 25px;
            background-color: transparent;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-cadastro:hover {
            background-color: #0f172a;
        }

        .btn-cadastro a {
            color: #0f172a;
            text-decoration: none;
        }

        .btn-cadastro a:hover {
            
            color: #00d2ff;
        }
    </style>
</head>

<body>

    <h1 class="titulo_principal">
        Hotel Monopolio
    </h1>

    <div class="meio">

        <h2 class="titulo_secundario">
            Acesso do Cliente
        </h2>

        <form class="form" action="autenticar.php" method="post">

            <label class="label" for="email">
                Email
            </label>

            <input class="input"
                   type="email"
                   id="email"
                   name="email"
                   placeholder="seuemail@email.com.br"
                   required>

            <label class="label" for="senha">
                Senha
            </label>

            <input class="input"
                   type="password"
                   id="senha"
                   name="senha"
                   placeholder="Sua senha"
                   required>

            <button class="btn-enviar" type="submit">
                ENTRAR
            </button>

        </form>

        <div class="cadastro">

            <button class="btn-cadastro">
                <a href="http://localhost/Hotel_joao/cadastro_cliente.html">
                    Ainda não é cadastrado?
                    <br>
                    Clique aqui
                </a>
            </button>

        </div>

    </div>

</body>

</html>
