<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Quartos - Hotel Monopolio</title>
    <link rel="stylesheet" href="css/estilo.css">
    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
        }

        .titulo_principal {
            color: #0f172a;
            background-color: white;
            border: 3px solid #00d2ff;
            border-radius: 50px;
            width: 350px;
            margin: 30px auto;
            padding: 10px;
            text-align: center;
        }

        .meio {
            width: 450px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 210, 255, 0.15);
        }

        .titulo_secundario {
            color: #1e293b;
            margin-bottom: 30px;
        }

        .form {
            text-align: left;
        }

        .label {
            color: #475569;
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        .input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            box-sizing: border-box;
        }

        .input:focus {
            border: 2px solid #00d2ff;
            outline: none;
        }

        .btn-enviar {
            width: 100%;
            padding: 12px;
            margin-top: 30px;
            border: none;
            border-radius: 25px;
            background-color: #0f172a;
            color: #00d2ff;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-enviar:hover {
            background-color: #00d2ff;
            color: #0f172a;
        }

        .links {
            margin-top: 20px;
            text-align: center;
        }

    </style>
</head>
<body>
    <h1 class="titulo_principal" style="color: #00a8cc; text-align: center;">HOTEL MONOPOLIO</h1>

    <div class="meio">
        <h2 class="titulo_secundario">Cadastro de Quartos</h2>
        <form class="form" action="salvar_quarto.php" method="POST">
            <label class="label" for="hotel_id">ID do Hotel:</label>
            <input class="input" type="number" name="hotel_id" id="hotel_id" placeholder="Ex: 1" min="1" required>

            <label class="label" for="numero">Número do Quarto:</label>
            <input class="input" type="text" name="numero" id="numero" placeholder="Ex: 101 ou 202-A" required>

            <label class="label" for="tipo">Tipo de Quarto:</label>
            <input class="input" type="text" name="tipo" id="tipo" placeholder="Ex: Solteiro, Casal, Suíte Luxo" required>

            <label class="label" for="preco_diaria">Preço da Diária (R$):</label>
            <input class="input" type="number" name="preco_diaria" id="preco_diaria" placeholder="Ex: 250.00" step="0.01" min="0" required>

            <button class="btn-enviar" type="submit">CADASTRAR QUARTO</button>
        </form>
        <div class="links">
            <a href="listar_quartos.php">Listar quartos</a><br><br>
            <a href="logout_hotel.php">Sair / Deslogar</a>
        </div>
        
    </div>
</body>
</html>
